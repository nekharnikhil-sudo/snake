<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Retro Snake Game - 20 Levels Responsive</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
        body {
            background-color: #0f172a;
            color: #fff;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 10px;
            touch-action: none;
        }
        h1 { color: #22c55e; margin-bottom: 8px; font-size: 24px; text-shadow: 0 0 10px rgba(34, 197, 94, 0.4); text-align: center; }
        
        .container {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 800px;
            max-width: 96vw;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
            border-radius: 12px;
            border: 2px solid #334155;
            overflow: hidden;
            background: #1e293b;
        }
        .hud {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            background: #1e293b;
            padding: 10px 16px;
            font-weight: bold;
            font-size: 15px;
            border-bottom: 2px solid #334155;
        }
        .hud-item { color: #94a3b8; }
        .hud-val { color: #22c55e; text-shadow: 0 0 5px rgba(34, 197, 94, 0.5); }
        .hud-level { color: #38bdf8; text-shadow: 0 0 5px rgba(56, 189, 248, 0.5); }
        
        canvas {
            background: #020617;
            display: block;
            width: 100%;
            height: auto;
            max-height: 72vh;
            cursor: pointer;
        }
        
        .overlay {
            position: absolute;
            top: 45px;
            left: 0;
            width: 100%;
            height: calc(100% - 45px);
            background: rgba(15, 23, 42, 0.95);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }
        .overlay h2 { color: #22c55e; font-size: 32px; margin-bottom: 10px; text-shadow: 0 0 15px #22c55e; text-align: center; }
        .overlay p { color: #94a3b8; margin-bottom: 20px; font-size: 14px; text-align: center; padding: 0 20px; line-height: 1.5; }
        .btn {
            background: #22c55e;
            color: #000;
            border: none;
            padding: 14px 32px;
            font-size: 17px;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(34, 197, 94, 0.5);
            transition: transform 0.1s;
        }
        .btn:active { transform: scale(0.95); }
    </style>
</head>
<body>

    <h1>🐍 20 LEVELS SNAKE EXTREME</h1>
    
    <div class="container">
        <div class="hud">
            <div class="hud-item">SCORE: <span id="score" class="hud-val">0</span> / <span id="targetScore" class="hud-val">200</span></div>
            <div class="hud-item">LEVEL: <span id="level" class="hud-level">1 / 20</span></div>
            <div class="hud-item">HIGH: <span id="highScore" class="hud-val">0</span></div>
        </div>
        
        <canvas id="gameCanvas" width="800" height="600"></canvas>
        
        <div id="overlay" class="overlay">
            <h2 id="overlay-title">SNAKE GAME</h2>
            <p id="overlay-desc">लैपटॉप: Arrow / WASD Keys<br>मोबाइल: Swipe Controls</p>
            <button class="btn" id="start-btn">स्टार्ट गेम</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreEl = document.getElementById('score');
        const targetScoreEl = document.getElementById('targetScore');
        const levelEl = document.getElementById('level');
        const highScoreEl = document.getElementById('highScore');
        const overlay = document.getElementById('overlay');
        const startBtn = document.getElementById('start-btn');

        const gridSize = 20;
        const tileCountX = canvas.width / gridSize;  // 40 cols
        const tileCountY = canvas.height / gridSize; // 30 rows

        let isMobile = window.innerWidth <= 600;
        window.addEventListener('resize', () => {
            isMobile = window.innerWidth <= 600;
        });

        let snake = [{x: 200, y: 300}, {x: 180, y: 300}, {x: 160, y: 300}];
        let food = {x: 100, y: 100};
        let bomb = {x: -100, y: -100};
        let trapFood = {x: -100, y: -100};
        let obstacles = [];

        let dx = gridSize;
        let dy = 0;
        let levelScore = 0;
        let totalScore = 0;
        let level = 1;
        let speed = 120;
        let currentTarget = 200;

        let highScore = localStorage.getItem('snake_20lvl_high') || 0;
        highScoreEl.innerText = highScore;
        let gameInterval = null;
        let audioCtx = null;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function playEatSound() {
            initAudio();
            if (!audioCtx) return;
            try {
                let now = audioCtx.currentTime;
                let osc1 = audioCtx.createOscillator();
                let osc2 = audioCtx.createOscillator();
                let gain = audioCtx.createGain();
                osc1.type = 'square'; osc2.type = 'square';
                osc1.connect(gain); osc2.connect(gain);
                gain.connect(audioCtx.destination);

                osc1.frequency.setValueAtTime(987.77, now);
                osc2.frequency.setValueAtTime(1318.51, now + 0.06);

                gain.gain.setValueAtTime(0.12, now);
                gain.gain.setValueAtTime(0.12, now + 0.06);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.22);

                osc1.start(now); osc1.stop(now + 0.06);
                osc2.start(now + 0.06); osc2.stop(now + 0.22);
            } catch(e) {}
        }

        function playDieSound() {
            initAudio();
            if (!audioCtx) return;
            try {
                let now = audioCtx.currentTime;
                let osc = audioCtx.createOscillator();
                let gain = audioCtx.createGain();
                osc.type = 'sawtooth';
                osc.connect(gain); gain.connect(audioCtx.destination);

                osc.frequency.setValueAtTime(220, now);
                osc.frequency.linearRampToValueAtTime(40, now + 0.45);
                gain.gain.setValueAtTime(0.35, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.45);

                osc.start(now); osc.stop(now + 0.45);
            } catch(e) {}
        }

        function getTargetScore(lvl) {
            let base = isMobile ? 100 : 200;
            if (lvl <= 10) {
                return base;
            } else {
                return base + ((lvl - 10) * 10);
            }
        }

        function setDir(newDx, newDy) {
            if (newDx !== -dx && newDy !== -dy) {
                dx = newDx;
                dy = newDy;
            }
        }

        document.addEventListener('keydown', e => {
            initAudio();
            if ((e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') && dy === 0) setDir(0, -gridSize);
            if ((e.key === 'ArrowDown' || e.key === 's' || e.key === 'S') && dy === 0) setDir(0, gridSize);
            if ((e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') && dx === 0) setDir(-gridSize, 0);
            if ((e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') && dx === 0) setDir(gridSize, 0);
        });

        let touchStartX = 0, touchStartY = 0;
        canvas.addEventListener('touchstart', e => {
            initAudio();
            touchStartX = e.touches[0].clientX;
            touchStartY = e.touches[0].clientY;
        }, {passive: true});

        canvas.addEventListener('touchmove', e => {
            if (!touchStartX || !touchStartY) return;
            let touchEndX = e.touches[0].clientX;
            let touchEndY = e.touches[0].clientY;

            let diffX = touchEndX - touchStartX;
            let diffY = touchEndY - touchStartY;

            if (Math.abs(diffX) > Math.abs(diffY)) {
                if (diffX > 20 && dx === 0) { setDir(gridSize, 0); touchStartX = touchEndX; touchStartY = touchEndY; }
                else if (diffX < -20 && dx === 0) { setDir(-gridSize, 0); touchStartX = touchEndX; touchStartY = touchEndY; }
            } else {
                if (diffY > 20 && dy === 0) { setDir(0, gridSize); touchStartX = touchEndX; touchStartY = touchEndY; }
                else if (diffY < -20 && dy === 0) { setDir(0, -gridSize); touchStartX = touchEndX; touchStartY = touchEndY; }
            }
        }, {passive: true});

        function setupLevel(lvl) {
            level = lvl;
            levelScore = 0;
            currentTarget = getTargetScore(level);
            
            levelEl.innerText = `${level} / 20`;
            targetScoreEl.innerText = currentTarget;
            scoreEl.innerText = levelScore;

            obstacles = [];
            bomb = {x: -100, y: -100};
            trapFood = {x: -100, y: -100};

            speed = Math.max(55, 120 - (lvl * 3));

            // Level 6+ Barriers/Obstacles
            if (lvl >= 6) {
                const count = Math.min(14, lvl - 3);
                for (let i = 0; i < count; i++) {
                    obstacles.push({
                        x: (6 + (i * 2) % 28) * gridSize,
                        y: (4 + Math.floor(i / 2) * 3) * gridSize
                    });
                }
            }

            spawnEntities();
        }

        function spawnEntities() {
            let valid = false;
            while (!valid) {
                food.x = Math.floor(Math.random() * tileCountX) * gridSize;
                food.y = Math.floor(Math.random() * tileCountY) * gridSize;
                valid = !isCollisionWithAnything(food.x, food.y);
            }

            // Bomb Spawn (Level 2 to 20)
            if (level >= 2) {
                valid = false;
                while (!valid) {
                    bomb.x = Math.floor(Math.random() * tileCountX) * gridSize;
                    bomb.y = Math.floor(Math.random() * tileCountY) * gridSize;
                    valid = !isCollisionWithAnything(bomb.x, bomb.y);
                }
            }

            // Trap Apple Spawn (Level 6 to 20)
            if (level >= 6) {
                valid = false;
                while (!valid) {
                    trapFood.x = Math.floor(Math.random() * tileCountX) * gridSize;
                    trapFood.y = Math.floor(Math.random() * tileCountY) * gridSize;
                    valid = !isCollisionWithAnything(trapFood.x, trapFood.y);
                }
            }
        }

        function isCollisionWithAnything(x, y) {
            for (let part of snake) if (part.x === x && part.y === y) return true;
            for (let obs of obstacles) if (obs.x === x && obs.y === y) return true;
            if (food.x === x && food.y === y) return true;
            return false;
        }

        startBtn.addEventListener('click', startGame);

        function startGame() {
            initAudio();
            snake = [{x: 200, y: 300}, {x: 180, y: 300}, {x: 160, y: 300}];
            dx = gridSize;
            dy = 0;
            totalScore = 0;
            overlay.style.display = 'none';
            setupLevel(1);

            if (gameInterval) clearInterval(gameInterval);
            runGameLoop();
        }

        function runGameLoop() {
            if (gameInterval) clearInterval(gameInterval);
            gameInterval = setInterval(main, speed);
        }

        function main() {
            let head = {x: snake[0].x + dx, y: snake[0].y + dy};

            // Boundary Hit
            if (head.x < 0 || head.x >= canvas.width || head.y < 0 || head.y >= canvas.height) {
                endGame("दीवार से टकरा गए!");
                return;
            }

            // Self Hit
            for (let part of snake) {
                if (head.x === part.x && head.y === part.y) {
                    endGame("सांप खुद से टकरा गया!");
                    return;
                }
            }

            // Barrier Hit
            for (let obs of obstacles) {
                if (head.x === obs.x && head.y === obs.y) {
                    endGame("रुकावट (Barrier) से टकरा गए!");
                    return;
                }
            }

            // Bomb Hit 💣
            if (level >= 2 && head.x === bomb.x && head.y === bomb.y) {
                endGame("💣 बॉम्ब धमाका! गेम ओवर!");
                return;
            }

            // Trap Hit 🍎
            if (level >= 6 && head.x === trapFood.x && head.y === trapFood.y) {
                endGame("🍎 ज़हरीला सेब खा लिया!");
                return;
            }

            snake.unshift(head);

            // Eat Food
            if (head.x === food.x && head.y === food.y) {
                levelScore += 10;
                totalScore += 10;
                scoreEl.innerText = levelScore;
                playEatSound();

                if (totalScore > highScore) {
                    highScore = totalScore;
                    localStorage.setItem('snake_20lvl_high', highScore);
                    highScoreEl.innerText = highScore;
                }

                // Check Level Progression
                if (levelScore >= currentTarget) {
                    if (level < 20) {
                        level++;
                        setupLevel(level);
                        runGameLoop();
                    } else {
                        endGame("🏆 बधाई हो! आपने सभी 20 लेवल्स पार कर लिए!");
                        return;
                    }
                } else {
                    spawnEntities();
                }
            } else {
                snake.pop();
            }

            draw();
        }

        function draw() {
            ctx.fillStyle = '#020617';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Background Grid
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.02)';
            ctx.lineWidth = 1;
            for (let x = 0; x < canvas.width; x += gridSize) {
                ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
            }
            for (let y = 0; y < canvas.height; y += gridSize) {
                ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
            }

            // Barriers
            ctx.fillStyle = '#64748b';
            obstacles.forEach(obs => {
                ctx.fillRect(obs.x + 1, obs.y + 1, gridSize - 2, gridSize - 2);
            });

            // Green Food
            ctx.fillStyle = '#22c55e';
            ctx.shadowBlur = 10; ctx.shadowColor = '#22c55e';
            ctx.fillRect(food.x + 2, food.y + 2, gridSize - 4, gridSize - 4);
            ctx.shadowBlur = 0;

            // Bomb 💣
            if (level >= 2) {
                ctx.fillStyle = '#ef4444';
                ctx.shadowBlur = 12; ctx.shadowColor = '#ef4444';
                ctx.beginPath();
                ctx.arc(bomb.x + gridSize / 2, bomb.y + gridSize / 2, gridSize / 2 - 2, 0, Math.PI * 2);
                ctx.fill();
                ctx.shadowBlur = 0;

                ctx.fillStyle = '#f59e0b';
                ctx.fillRect(bomb.x + 8, bomb.y + 2, 4, 4);
            }

            // Trap Apple 🍎
            if (level >= 6) {
                ctx.fillStyle = '#a855f7';
                ctx.shadowBlur = 8; ctx.shadowColor = '#a855f7';
                ctx.fillRect(trapFood.x + 3, trapFood.y + 3, gridSize - 6, gridSize - 6);
                ctx.shadowBlur = 0;
            }

            // Snake
            snake.forEach((part, index) => {
                ctx.fillStyle = index === 0 ? '#38bdf8' : '#0284c7';
                ctx.fillRect(part.x + 1, part.y + 1, gridSize - 2, gridSize - 2);
            });
        }

        function endGame(reason) {
            clearInterval(gameInterval);
            playDieSound();
            document.getElementById('overlay-title').innerText = reason.includes("बधाई") ? "VICTORY!" : "गेम ओवर";
            document.getElementById('overlay-desc').innerHTML = `${reason}<br><br><b>कुल स्कोर: ${totalScore} | लेवल: ${level}</b>`;
            document.getElementById('start-btn').innerText = "फिर से खेलें";
            overlay.style.display = 'flex';
        }
    </script>
</body>
</html>
