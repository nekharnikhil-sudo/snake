<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Retro Snake Game - Touch & Sound</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
        body {
            background-color: #0f172a;
            color: #fff;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 10px;
            touch-action: none; /* पेज को ज़ूम या स्क्रॉल होने से रोकता है ताकि गेम स्मूथ चले */
        }
        h1 { color: #22c55e; margin-bottom: 12px; font-size: 26px; text-shadow: 0 0 10px rgba(34, 197, 94, 0.4); }
        .container {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
            border-radius: 8px;
            overflow: hidden;
        }
        .hud {
            display: flex;
            justify-content: space-between;
            width: 360px;
            background: #1e293b;
            padding: 12px 18px;
            font-weight: bold;
            font-size: 16px;
            border-bottom: 2px solid #334155;
        }
        .hud span { color: #22c55e; }
        canvas {
            background: #020617;
            display: block;
            cursor: pointer;
        }
        .overlay {
            position: absolute;
            top: 47px;
            left: 0;
            width: 360px;
            height: 360px;
            background: rgba(15, 23, 42, 0.94);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        .overlay h2 { color: #22c55e; font-size: 30px; margin-bottom: 10px; text-shadow: 0 0 10px #22c55e; }
        .overlay p { color: #94a3b8; margin-bottom: 25px; font-size: 14px; text-align: center; padding: 0 20px; }
        .btn {
            background: #22c55e;
            color: #000;
            border: none;
            padding: 14px 30px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(34, 197, 94, 0.4);
            transition: transform 0.1s;
        }
        .btn:active { transform: scale(0.95); }
    </style>
</head>
<body>

    <h1>🐍 स्नेक गेम</h1>
    
    <div class="container">
        <div class="hud">
            <div>स्कोर: <span id="score">0</span></div>
            <div>हाई स्कोर: <span id="highScore">0</span></div>
        </div>
        <canvas id="gameCanvas" width="360" height="360"></canvas>
        
        <div id="overlay" class="overlay">
            <h2>SNAKE GAME</h2>
            <p>मोबाइल पर स्क्रीन पर **स्वाइप (Swipe)** करें और लैपटॉप पर **कीबोर्ड (Arrow Keys)** का उपयोग करें!</p>
            <button class="btn" onclick="startGame()">स्टार्ट गेम</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreEl = document.getElementById('score');
        const highScoreEl = document.getElementById('highScore');
        const overlay = document.getElementById('overlay');

        const gridSize = 20;
        const tileCount = 18;

        let snake = [{x: 160, y: 160}, {x: 140, y: 160}, {x: 120, y: 160}];
        let food = {x: 60, y: 60};
        let dx = gridSize;
        let dy = 0;
        let score = 0;
        let highScore = localStorage.getItem('snake_high_sound') || 0;
        highScoreEl.innerText = highScore;
        let gameInterval = null;
        let audioCtx = null;

        // Web Audio API Sound Generator (बिना किसी बाहरी ऑडियो फाइल के)
        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        // पॉइंट खाने पर "तुलुल" आवाज़
        function playEatSound() {
            initAudio();
            if (!audioCtx) return;
            try {
                let now = audioCtx.currentTime;
                let osc = audioCtx.createOscillator();
                let gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.connect(gain);
                gain.connect(audioCtx.destination);

                //तुलुल (Dual-tone pitch change)
                osc.frequency.setValueAtTime(523.25, now); // C5
                osc.frequency.setValueAtTime(659.25, now + 0.08); // E5
                gain.gain.setValueAtTime(0.15, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.18);

                osc.start(now);
                osc.stop(now + 0.18);
            } catch(e) {}
        }

        // गेम ओवर (मरने पर) की आवाज़
        function playDieSound() {
            initAudio();
            if (!audioCtx) return;
            try {
                let now = audioCtx.currentTime;
                let osc = audioCtx.createOscillator();
                let gain = audioCtx.createGain();
                osc.type = 'sawtooth';
                osc.connect(gain);
                gain.connect(audioCtx.destination);

                osc.frequency.setValueAtTime(180, now);
                osc.frequency.linearRampToValueAtTime(50, now + 0.4);
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.4);

                osc.start(now);
                osc.stop(now + 0.4);
            } catch(e) {}
        }

        function setDir(newDx, newDy) {
            if (newDx !== -dx && newDy !== -dy) {
                dx = newDx;
                dy = newDy;
            }
        }

        // कीबोर्ड कंट्रोल्स (लैपटॉप के लिए)
        document.addEventListener('keydown', e => {
            if (e.key === 'ArrowUp' && dy === 0) setDir(0, -gridSize);
            if (e.key === 'ArrowDown' && dy === 0) setDir(0, gridSize);
            if (e.key === 'ArrowLeft' && dx === 0) setDir(-gridSize, 0);
            if (e.key === 'ArrowRight' && dx === 0) setDir(gridSize, 0);
        });

        // टच स्वाइप कंट्रोल्स (मोबाइल के लिए)
        let touchStartX = 0;
        let touchStartY = 0;

        canvas.addEventListener('touchstart', e => {
            touchStartX = e.touches[0].clientX;
            touchStartY = e.touches[0].clientY;
        }, {passive: true});

        canvas.addEventListener('touchmove', e => {
            if (!touchStartX || !touchStartY) return;
            let touchEndX = e.touches[0].clientX;
            let touchEndY = e.touches[0].clientY;

            let diffX = touchEndX - touchStartX;
            let diffY = touchEndY - touchStartY;

            if (Math.abs(diffX) > Math.abs(diffY)) {
                // Horizontal Swipe
                if (diffX > 20 && dx === 0) { setDir(gridSize, 0); touchStartX = touchEndX; touchStartY = touchEndY; }
                else if (diffX < -20 && dx === 0) { setDir(-gridSize, 0); touchStartX = touchEndX; touchStartY = touchEndY; }
            } else {
                // Vertical Swipe
                if (diffY > 20 && dy === 0) { setDir(0, gridSize); touchStartX = touchEndX; touchStartY = touchEndY; }
                else if (diffY < -20 && dy === 0) { setDir(0, -gridSize); touchStartX = touchEndX; touchStartY = touchEndY; }
            }
        }, {passive: true});

        function startGame() {
            initAudio();
            snake = [{x: 160, y: 160}, {x: 140, y: 160}, {x: 120, y: 160}];
            dx = gridSize;
            dy = 0;
            score = 0;
            scoreEl.innerText = score;
            overlay.style.display = 'none';
            spawnFood();
            if (gameInterval) clearInterval(gameInterval);
            gameInterval = setInterval(main, 130);
        }

        function spawnFood() {
            food.x = Math.floor(Math.random() * tileCount) * gridSize;
            food.y = Math.floor(Math.random() * tileCount) * gridSize;
            // यह सुनिश्चित करना कि खाना सांप के शरीर के ऊपर न आए
            snake.forEach(part => {
                if (part.x === food.x && part.y === food.y) spawnFood();
            });
        }

        function main() {
            let head = {x: snake[0].x + dx, y: snake[0].y + dy};

            // दीवार या खुद से टकराने पर गेम ओवर
            if (head.x < 0 || head.x >= canvas.width || head.y < 0 || head.y >= canvas.height) {
                endGame();
                return;
            }
            for (let part of snake) {
                if (head.x === part.x && head.y === part.y) {
                    endGame();
                    return;
                }
            }

            snake.unshift(head);

            // अगर खाना खा लिया
            if (head.x === food.x && head.y === food.y) {
                score += 10;
                scoreEl.innerText = score;
                playEatSound(); // 'तुलुल' आवाज़ बजेगी
                if (score > highScore) {
                    highScore = score;
                    localStorage.setItem('snake_high_sound', highScore);
                    highScoreEl.innerText = highScore;
                }
                spawnFood();
            } else {
                snake.pop();
            }

            // स्क्रीन ड्रॉ करना
            ctx.fillStyle = '#020617';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // खाना (लाल बिंदु)
            ctx.fillStyle = '#ef4444';
            ctx.shadowBlur = 10;
            ctx.shadowColor = '#ef4444';
            ctx.fillRect(food.x + 2, food.y + 2, gridSize - 4, gridSize - 4);
            ctx.shadowBlur = 0;

            // सांप
            snake.forEach((part, index) => {
                ctx.fillStyle = index === 0 ? '#22c55e' : '#16a34a';
                ctx.fillRect(part.x + 1, part.y + 1, gridSize - 2, gridSize - 2);
            });
        }

        function endGame() {
            clearInterval(gameInterval);
            playDieSound(); // मरने वाली आवाज़ बजेगी
            overlay.querySelector('h2').innerText = "गेम ओवर";
            overlay.querySelector('p').innerText = "आपका स्कोर: " + score;
            overlay.querySelector('.btn').innerText = "फिर से खेलें";
            overlay.style.display = 'flex';
        }
    </script>
</body>
</html>
